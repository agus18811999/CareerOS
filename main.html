async function api(action,payload={},opts={}){
  if(!auth.currentUser)throw new Error('Sesi tidak ditemukan. Silakan login kembali.');
  const token=await auth.currentUser.getIdToken();
  const requestId=opts.mutation?crypto.randomUUID():undefined;
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),34000);

    const response=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,payload,requestId,apiVersion:'1.0'}),signal:controller.signal,cache:'no-store'});

const monthTitle=month=>new Date(`${month}-15T12:00:00Z`).toLocaleDateString('id-ID',{month:'long',year:'numeric',timeZone:'UTC'});
const dayString=d=>d.toISOString().slice(0,10);
function shiftMonth(month,delta){const x=new Date(month+'-01T12:00:00Z');x.setUTCMonth(x.getUTCMonth()+delta);return dayString(x).slice(0,7);}
function monthRange(month){const a=new Date(`${month}-01T00:00:00Z`),b=new Date(a);b.setUTCMonth(b.getUTCMonth()+1);b.setUTCDate(b.getUTCDate()-1);return {start:dayString(a),end:dayString(b)};}
function calendarItems(data){const arr=data.items||[];if(!arr.length)return empty('Nothing scheduled yet','Add a career event, or link a deadline to your tasks.');return `<div class="agenda-list">${arr.map(ev=>`<button type="button" class="agenda-card" data-event-open="${esc(ev.id)}"><span class="date-block"><strong>${esc(String(ev.date||'').slice(8,10))}</strong><span>${esc(prettyDate(ev.date).split(' ')[1]||'')}</span></span><span style="flex:1;min-width:0"><strong>${esc(ev.title)}</strong><small>${esc(ev.type||'Event')} · ${esc(prettyDate(ev.date))}${ev.derived?' · Linked record':''}</small></span>${icon('chevron',15)}</button>`).join('')}</div>`;}
function calendarMonthGrid(events,month){const first=new Date(`${month}-01T12:00:00Z`),startOffset=first.getUTCDay(),begin=new Date(first);begin.setUTCDate(begin.getUTCDate()-startOffset);
  const eventsBy={};events.forEach(ev=>{const k=String(ev.date||'').slice(0,10);(eventsBy[k]??=[]).push(ev);});
  const today=todayJakarta();const dates=Array.from({length:42},(_,i)=>{const d=new Date(begin);d.setUTCDate(d.getUTCDate()+i);return dayString(d);});
  return `<div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(n=>`<div class="cal-dayname">${n}</div>`).join('')}${dates.map(d=>{const list=eventsBy[d]||[];return `<div class="cal-cell ${d.slice(0,7)!==month?'outside':''} ${d===today?'today':''}"><span class="cal-num">${Number(d.slice(8))}</span>${list.slice(0,2).map(ev=>`<button class="cal-event" data-event-open="${esc(ev.id)}" type="button" title="${esc(ev.title)}">${esc(ev.title)}</button>`).join('')}${list.length>2?`<button class="cal-event cal-more" data-day="${d}">+${list.length-2} more</button>`:''}</div>`;}).join('')}</div>`;
}
function calendarWeek(events,month){const d=new Date(month+'-01T12:00:00Z'),start=new Date(d);start.setUTCDate(1-start.getUTCDay());const days=Array.from({length:7},(_,i)=>{const x=new Date(start);x.setUTCDate(x.getUTCDate()+i);return dayString(x);});return `<div class="cal-grid">${days.map(day=>`<div class="cal-dayname" style="padding:15px 5px">${esc(prettyDate(day))}</div>`).join('')}${days.map(day=>`<div class="cal-cell" style="min-height:170px">${events.filter(x=>String(x.date).slice(0,10)===day).map(ev=>`<button class="cal-event" data-event-open="${esc(ev.id)}">${esc(ev.title)}</button>`).join('')}</div>`).join('')}</div>`;}
async function renderCalendar(force=false){const host=$('#content'),month=state.calendarMonth,range=monthRange(month),key=month,cache=state.cache.calendar;
  const actions=button(icon('plus')+' Add event','data-calendar-add="1"','primary')+button(icon('refresh')+' Refresh','data-refresh="1"');
  if(!cache||cache.key!==key)host.innerHTML=pageHead('calendar',actions)+`<div class="panel">${empty('Loading calendar','Gathering schedule and deadlines...')}</div>`;
  try{const data=(!force&&cache?.key===key&&Date.now()-cache.fetched<60000)?cache.data:await api('listCalendarEvents',{start:range.start,end:range.end});state.cache.calendar={key,data,fetched:Date.now()};
    if(state.route!=='calendar')return;const items=data.items||[],view=state.calendarView;
    const toolbar=`<div class="cal-toolbar"><button class="btn small" data-cal-nav="-1">${icon('left',12)}</button><button class="btn small" data-cal-nav="0">Today</button><button class="btn small" data-cal-nav="1">${icon('chevron',12)}</button><strong class="cal-month">${esc(monthTitle(month))}</strong><span class="segment">${['month','week','day','agenda'].map(x=>`<button data-cal-view="${x}" class="${view===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</span></div>`;
    const now=todayJakarta();let content;if(view==='month')content=calendarMonthGrid(items,month);
    else if(view==='week')content=calendarWeek(items,month);
    else if(view==='day'){const current=now.slice(0,7)===month?now:month+'-01';content=`<h3 style="margin-bottom:15px">${esc(prettyDate(current))}</h3>${calendarItems({items:items.filter(x=>String(x.date).slice(0,10)===current)})}`;}
    else content=calendarItems(data);
    host.innerHTML=pageHead('calendar',actions)+`<div class="panel"><div class="calendar-wrap">${toolbar}${content}</div></div>`;
  }catch(e){if(state.route==='calendar')host.innerHTML=pageHead('calendar',actions)+errorPanel(e);}
}
async function eventOpen(id){const c=[...(state.cache.calendar?.data?.items||[]),...(state.cache.overview?.data?.upcoming||[])],event=c.find(x=>x.id===id);
  if(!event){toast('Event not found in the current view.','error');return;}
  if(event.derived){const mod=event.relatedModule;if(MODULES[mod]){go(mod);toast('Opening linked '+MODULES[mod].title+'.');}else toast('Linked record: '+(mod||'unknown'));return;}
  const row=await api('getRecord',{module:'CalendarEvents',id:event.id}).catch(e=>{toast(e.message,'error');return null;});if(row)detailsOpen('CalendarEvents',row.id);
}
async function renderAnalytics(force=false){const host=$('#content');if(!state.cache.analytics)host.innerHTML=pageHead('analytics')+`<div class="panel">${empty('Preparing analytics','Calculating actual application metrics...')}</div>`;
  try{const cached=state.cache.analytics;const data=!force&&cached&&Date.now()-cached.fetched<60000?cached.data:await api('getCareerAnalytics');state.cache.analytics={data,fetched:Date.now()};if(state.route!=='analytics')return;
    const fmt=v=>v===null||v===undefined?'N/A':v.toFixed(1)+'%';const t=data.totals;
    const stats=[['Total applications',String(t.applications)],['Success rate',fmt(t.successRate)],['Interview conversion',fmt(t.interviewRate)],['Avg. recruitment',t.avgDurationDays==null?'N/A':t.avgDurationDays.toFixed(1)+' days']];
    const chartPanel=(title,id,subtitle)=>`<section class="panel"><div class="panel-head"><div><h3>${esc(title)}</h3><span>${esc(subtitle)}</span></div></div><div class="panel-body"><div class="chart-box"><canvas id="${id}" aria-label="${esc(title)}"></canvas></div></div></section>`;
    host.innerHTML=pageHead('analytics',button(icon('refresh')+' Refresh','data-refresh="1"')+button(icon('download')+' Export applications','data-export="JobApplications"')+button(icon('download')+' Print / PDF','data-print="1"'))+
    `<div class="stat-strip">${stats.map(([title,v])=>`<div class="stat-tile"><small>${esc(title)}</small><strong>${esc(v)}</strong></div>`).join('')}</div><div class="hint">Semua angka dihitung dari data akun ini. Success rate = Accepted / total applications. Interview conversion merupakan pendekatan berdasarkan status terkini, bukan rekam riwayat interview secara penuh.</div>`+
    `<div class="chart-grid">${chartPanel('Applications over time','monthlyChart','Distribution by application month')}${chartPanel('Recruitment stage breakdown','stageChart','Current status of all applications')}${chartPanel('Applications by channel','channelChart','Where your opportunities came from')}${chartPanel('Top companies','companyChart','Most applied companies')}</div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Additional metrics</h3></div><div class="panel-body" style="display:flex;flex-wrap:wrap;gap:18px;font-size:11px;color:#697380"><span>Internships: <b>${data.internships}</b></span><span>Volunteer hours: <b>${data.volunteerHours}</b></span><span>Accepted: <b>${t.accepted}</b></span><span>Rejected: <b>${t.rejected}</b></span></div></div>`;
    if(!t.applications){toast('Charts are ready. Add applications to see your data.');return;}
    try{await ensureCharts();if(state.route!=='analytics')return;destroyCharts();const makeData=obj=>Object.entries(obj||{}).sort((a,b)=>a[0].localeCompare(b[0]));
      const setup=(id,type,entry,options={})=>{const canvas=document.getElementById(id);if(!canvas||!window.Chart)return;const x=entry.map(z=>z[0]),y=entry.map(z=>z[1]);const c=new window.Chart(canvas,{type,data:{labels:x,datasets:[{label:'Applications',data:y,backgroundColor:type==='line'?'#ffad67':['#ff8530','#ffc08f','#ffe0c3','#5b95db','#74b9a3','#9da4f6'],borderColor:'#ff7a1a',borderWidth:type==='line'?2:0,pointRadius:4,fill:type==='line',tension:.34,borderRadius:type==='bar'?7:undefined}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,ticks:{precision:0}},x:{grid:{display:false},ticks:{maxRotation:35}}},...options}});state.chartInstances.push(c);};
      setup('monthlyChart','line',makeData(data.byMonth));setup('stageChart','doughnut',makeData(data.byStage));setup('channelChart','bar',makeData(data.byChannel));setup('companyChart','bar',makeData(data.byCompany).sort((a,b)=>b[1]-a[1]).slice(0,9));
    }catch(e){toast('Chart library unavailable: '+e.message,'error');}
  }catch(e){if(state.route==='analytics')host.innerHTML=pageHead('analytics')+errorPanel(e);}
}
function ensureCharts(){if(window.Chart)return Promise.resolve();return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js';script.onload=resolve;script.onerror=()=>reject(new Error('Chart.js could not load'));document.head.appendChild(script);});}
async function renderNotifications(force=false){const host=$('#content');host.innerHTML=pageHead('notifications',button(icon('refresh')+' Check reminders','data-reminders="1"','primary'))+`<div class="panel">${empty('Loading notifications','Checking deadlines and recent alerts...')}</div>`;
  try{const cached=state.cache.notifications;const data=!force&&cached&&Date.now()-cached.fetched<60000?cached.data:await api('listNotifications');state.cache.notifications={data,fetched:Date.now()};if(state.route!=='notifications')return;
    const n=data.items||[],unread=n.filter(x=>!x.readAt).length;$('#notificationDot').hidden=unread===0;
    host.innerHTML=pageHead('notifications',button(icon('refresh')+' Check reminders','data-reminders="1"','primary'))+`<div class="panel"><div class="panel-head"><h3>Notification center</h3><span>${unread} unread · ${data.total||0} total</span></div><div class="panel-body">${n.length?n.map(x=>`<div class="activity-row" style="align-items:center"><span class="activity-dot">${icon('bell',14)}</span><div class="activity-text"><strong>${esc(x.title)}</strong><small>${esc(x.message)} · ${prettyDate(x.createdAt)}</small></div>${x.readAt?badge('Read'):`<button class="btn small" data-mark-read="${esc(x.id)}">Mark read</button>`}</div>`).join(''):empty('All caught up','Run reminder check to generate alerts for your upcoming events.')}</div></div>`;
  }catch(e){if(state.route==='notifications')host.innerHTML=pageHead('notifications')+errorPanel(e);}
}
const PROFILE_FIELDS=['fullName','headline','bio','photoUrl','occupation','careerField','preferredLocation','linkedIn','portfolioUrl','website','aspirations'];
const PREF_FIELDS=['currency','timezone','dateFormat','reminderDays','emailReminders','dashboardDefault'];
function settingsField(name,val=''){const isArea=longFields.has(name),label=labelOf(name);return `<div class="field ${isArea?'span2':''}"><label for="profile_${name}">${esc(label)}</label>${isArea?`<textarea id="profile_${name}" name="${name}">${esc(val)}</textarea>`:`<input name="${name}" id="profile_${name}" type="${getInputType(name)}" placeholder="${esc(label)}" value="${esc(val)}">`}</div>`;}
async function renderSettings(force=false){const host=$('#content');host.innerHTML=pageHead('settings')+`<div class="panel">${empty('Loading profile','Getting your secure profile information...')}</div>`;
  try{const [profile,prefs]=await Promise.all([state.profile&&!force?Promise.resolve(state.profile):api('getProfile'),state.prefs&&!force?Promise.resolve(state.prefs):api('getPreferences')]);state.profile=profile;state.prefs=prefs;setUserUI();if(state.route!=='settings')return;
    host.innerHTML=pageHead('settings')+`<div class="dashboard-grid" style="align-items:start"><section class="panel"><div class="panel-head"><div><h3>Personal profile</h3><span>Your professional identity and aspirations</span></div></div><div class="panel-body"><form id="profileForm"><div class="form-grid">${PROFILE_FIELDS.map(f=>settingsField(f,profile[f]||'')).join('')}</div><div style="margin-top:20px;display:flex;justify-content:flex-end"><button class="btn primary" type="submit">${icon('check',14)} Save profile</button></div></form></div></section><div><section class="panel" style="margin-bottom:15px"><div class="panel-head"><h3>Workspace preferences</h3></div><div class="panel-body"><form id="preferencesForm"><div class="form-grid">${PREF_FIELDS.map(f=>{const opts=f==='currency'?['IDR','USD','SGD','EUR']:f==='timezone'?['Asia/Jakarta','Asia/Makassar','Asia/Jayapura','UTC']:f==='dateFormat'?['DD/MM/YYYY','YYYY-MM-DD']:f==='emailReminders'?['false','true']:f==='dashboardDefault'?['overview','JobApplications','calendar','analytics']:null;return opts?`<div class="field"><label>${esc(labelOf(f))}</label><select name="${f}">${opts.map(x=>`<option value="${esc(x)}" ${String(prefs[f])===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`:settingsField(f,prefs[f]||'');}).join('')}</div><div style="text-align:right;margin-top:17px"><button type="submit" class="btn primary">Save preferences</button></div></form></div></section><section class="panel"><div class="panel-head"><h3>Account security</h3></div><div class="panel-body"><p style="color:#9299a6;font-size:10px;line-height:1.8;word-break:break-all">Signed in as <b>${esc(auth.currentUser?.email)}</b><br>Account ID: ${esc(auth.currentUser?.uid)}</p><button class="btn danger" data-logout="1">${icon('logout',14)} Sign out</button></div></section></div></div>`;
  }catch(e){if(state.route==='settings')host.innerHTML=pageHead('settings')+errorPanel(e);}
}
async function saveSettings(e,action){e.preventDefault();const form=e.target,btn=form.querySelector('[type=submit]'),data=Object.fromEntries(new FormData(form).entries());btn.disabled=true;
  try{const result=await api(action,{data},{mutation:true});if(action==='updateProfile'){state.profile=result;setUserUI();}else state.prefs=result;toast('Settings saved successfully.');}
  catch(err){toast(err.message,'error');}finally{btn.disabled=false;}
}
let searchTimer=null,dragging=null;
function actOnClick(e){return e.target.closest('button,[data-nav][role="button"]');}
document.addEventListener('click',async e=>{
  const el=actOnClick(e);if(!el)return;
  try{
    if(el.dataset.nav){go(el.dataset.nav);return;}
    if(el.dataset.close){document.getElementById(el.dataset.close)?.close();return;}
    if(el.dataset.refresh){navigate(state.route,true);return;}
    if(el.dataset.new){editorOpen(el.dataset.new);return;}
    if(el.dataset.calendarAdd){editorOpen('CalendarEvents',null,{date:todayJakarta(),type:'Interview'});return;}
    if(el.dataset.view){const m=state.route;state.view[m]=el.dataset.view;state.page[m]=0;renderRecords(m,false);return;}
    if(el.dataset.edit){const mod=state.route==='calendar'?'CalendarEvents':state.route;let record=getCachedRecord(mod,el.dataset.edit);if(!record)record=await api('getRecord',{module:mod,id:el.dataset.edit});$('#detailDialog').close();editorOpen(mod,record);return;}
    if(el.dataset.detail){detailsOpen(state.route,el.dataset.detail);return;}
    if(el.dataset.delete){const mod=state.route==='calendar'?'CalendarEvents':state.route;archiveRecord(mod,el.dataset.delete);return;}
    if(el.dataset.remove){const mod=state.route==='calendar'?'CalendarEvents':state.route;archiveRecord(mod,el.dataset.remove,true);return;}
    if(el.dataset.duplicate){const mod=state.route==='calendar'?'CalendarEvents':state.route;let r=getCachedRecord(mod,el.dataset.duplicate);if(!r)r=await api('getRecord',{module:mod,id:el.dataset.duplicate});const copy={...r};delete copy.id;delete copy.createdAt;delete copy.updatedAt;delete copy.version;$('#detailDialog').close();editorOpen(mod,null,copy);return;}
    if(el.dataset.bulkApply){const mod=state.route,ids=[...(state.selected[mod]||[])],status=$('#bulkStatus')?.value;if(!status){toast('Choose a status first.','error');return;}if(!ids.length)return;await api('bulkUpdateRecords',{module:mod,ids,data:{status}},{mutation:true});state.selected[mod]=new Set();invalidate(mod);toast(`Updated ${ids.length} records.`);navigate(mod,true);return;}
    if(el.dataset.apply){applyOpportunity(el.dataset.apply);return;}
    if(el.dataset.linkInterview){$('#detailDialog').close();editorOpen('CalendarEvents',null,{title:'Interview — '+(getCachedRecord('JobApplications',el.dataset.linkInterview)?.company||'Job Application'),type:'Interview',date:todayJakarta(),relatedModule:'JobApplications',relatedId:el.dataset.linkInterview});return;}
    if(el.dataset.convert){convert(state.route,el.dataset.convert);return;}
    if(el.dataset.complete){complete(state.route,el.dataset.complete);return;}
    if(el.dataset.page){let m=state.route;state.page[m]=Math.max(0,(state.page[m]||0)+(el.dataset.page==='next'?1:-1));renderRecords(m,false);return;}
    if(el.dataset.export){exportModule(el.dataset.export);return;}
    if(el.dataset.eventOpen){eventOpen(el.dataset.eventOpen);return;}
    if(el.dataset.day){state.calendarView='agenda';navigate('calendar',false);return;}
    if(el.dataset.calNav){state.calendarMonth=el.dataset.calNav==='0'?todayJakarta().slice(0,7):shiftMonth(state.calendarMonth,Number(el.dataset.calNav));renderCalendar(false);return;}
    if(el.dataset.calView){state.calendarView=el.dataset.calView;renderCalendar(false);return;}
    if(el.dataset.reminders){try{const res=await api('processReminders',{}, {mutation:true});invalidate('Notifications');toast(`${res.created} new reminder(s) generated.`);renderNotifications(true);}catch(err){toast(err.message,'error');}return;}
    if(el.dataset.markRead){await api('markNotificationRead',{id:el.dataset.markRead},{mutation:true});invalidate('Notifications');renderNotifications(true);return;}
    if(el.dataset.print){window.print();return;}
    if(el.dataset.logout){if(await askConfirm('Sign out from CareerOS?')){await signOut(auth);location.replace('index.html');}return;}
  }catch(err){toast(err.message,'error');}
});
document.addEventListener('submit',e=>{if(e.target.id==='editorForm')editorSave(e);if(e.target.id==='profileForm')saveSettings(e,'updateProfile');if(e.target.id==='preferencesForm')saveSettings(e,'savePreferences');});
document.addEventListener('input',e=>{const input=e.target;if(input.id!=='moduleSearch'&&input.id!=='globalSearch')return;
  clearTimeout(searchTimer);const mod=state.route;if(!MODULES[mod]?.fields)return;
  searchTimer=setTimeout(()=>{state.filter[mod]=input.value.trim();state.page[mod]=0;renderRecords(mod,true);},320);
});
document.addEventListener('change',e=>{const x=e.target,m=state.route;if(x.id==='moduleSort'){state.sort[m]=x.value;state.page[m]=0;renderRecords(m,true);}
  if(x.id==='statusFilter'){state.statusFilter[m]=x.value;state.page[m]=0;renderRecords(m,true);}
  if(x.dataset.kanbanStatus){changeStage(m,x.dataset.kanbanStatus,x.value);}
  if(x.dataset.rowSelect){state.selected[m]??=new Set();if(x.checked)state.selected[m].add(x.dataset.rowSelect);else state.selected[m].delete(x.dataset.rowSelect);renderRecords(m,false);}
  if(x.id==='selectAll'){state.selected[m]??=new Set();const ids=(state.cache[cacheKey(m)]?.data.items||[]).map(r=>r.id);ids.forEach(id=>x.checked?state.selected[m].add(id):state.selected[m].delete(id));renderRecords(m,false);}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#moduleSearch'))$('#moduleSearch').focus();else $('#globalSearch').focus();}
  if(e.key==='Escape')closeSidebar();
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'&&e.target.dataset.nav){e.preventDefault();go(e.target.dataset.nav);}
});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-drag]');if(!el)return;dragging={id:el.dataset.drag,module:state.route};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragging.id);});
document.addEventListener('dragover',e=>{const col=e.target.closest('[data-drop]');if(!col||!dragging)return;e.preventDefault();col.classList.add('drag-over');});
document.addEventListener('dragleave',e=>{const col=e.target.closest('[data-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over');});
document.addEventListener('drop',e=>{const col=e.target.closest('[data-drop]');if(!col||!dragging)return;e.preventDefault();const d=dragging;dragging=null;$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(d.module===state.route)changeStage(d.module,d.id,col.dataset.drop);});
document.addEventListener('dragend',()=>{dragging=null;$$('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
$('#editorDialog').addEventListener('close',()=>{editorContext=null;});
$('#mobileToggle').innerHTML=icon('menu');$('#desktopToggle').innerHTML=icon('menu');$('#searchIcon').innerHTML=icon('search');$('#bellIcon').innerHTML=icon('bell');
$('#mobileToggle').addEventListener('click',openSidebar);$('#backdrop').addEventListener('click',closeSidebar);
$('#desktopToggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('collapsed');$('.app-main').classList.toggle('collapsed');});
$('#notificationsButton').addEventListener('click',()=>go('notifications'));
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)||'overview'));
window.addEventListener('resize',()=>{if(innerWidth>790)closeSidebar();});
window.addEventListener('unhandledrejection',e=>{console.warn('CareerOS async request:',e.reason?.message||'error');});
if(firebaseConfig.apiKey.startsWith('PASTE_')){$('#content').innerHTML=pageHead('overview')+`<div class="error-state">Configure your Firebase public web keys in <b>index.html</b> and <b>main.html</b> before launching.</div>`;}
else onAuthStateChanged(auth,async user=>{
  if(!user){location.replace('index.html');return;}
  if(!user.emailVerified){location.replace('index.html');return;}
  state.user=user;setUserUI();
  if(state.initialized)return;state.initialized=true;
  const route=location.hash.slice(1)||'overview';
  // Immediate shell; data fetched only for currently active route.
  navigate(route);
  try{const profile=await api('getProfile');state.profile=profile;setUserUI();if(state.route==='overview'&&state.cache.overview)$('#content').innerHTML=overviewHTML(state.cache.overview.data);}catch(e){toast('Profile: '+e.message,'error');}
});
</script>
